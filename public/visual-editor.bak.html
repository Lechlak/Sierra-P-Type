<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Label Visual Editor</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            display: flex;
            gap: 2rem;
            padding: 1rem;
            height: 95vh;
        }
        #editor-container, #code-output {
            border: 1px solid #ccc;
            padding: 1rem;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
        }
        #editor-container {
            width: 500px;
        }
        #code-output {
            flex-grow: 1;
        }
        #preview-area {
            border: 1px dashed #ccc;
            position: relative;
            margin-bottom: 1rem;
            background: #f9f9f9;
            flex-shrink: 0;
        }
        .controls {
            flex-grow: 1;
            overflow-y: auto;
        }
        .sub-label-container {
            position: absolute;
            border: 1px solid #9cf;
            box-sizing: border-box;
        }
        .label-element {
            position: absolute;
            white-space: nowrap;
            cursor: move;
            user-select: none;
            padding: 2px;
            border: 1px dotted transparent;
            transform-origin: center;
        }
        .label-element:hover {
            border-color: #ddd;
        }
        .control-group {
            border: 1px solid #eee;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
        }
        .control-group h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 14px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }
        input[type="text"], input[type="number"], input[type="range"] {
            width: 100%;
            box-sizing: border-box;
            padding: 4px;
        }
        #generated-code {
            width: 100%;
            flex-grow: 1;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            resize: none;
        }
        #format-selector {
            margin-bottom: 1rem;
            padding: 8px;
            font-size: 16px;
        }
        .action-bar {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
        }
        .print-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="editor-container">
        <h2>Visual Editor</h2>
        <select id="format-selector">
            <option>Loading Formats...</option>
        </select>
        <div id="preview-area"></div>
        <div class="controls"></div>
    </div>

    <div id="code-output">
        <h2>Generated Code</h2>
        <p>This will generate a Javascript object for the `labelFormats`.</p>
        <textarea id="generated-code" readonly></textarea>
        <div class="control-group" id="test-data-controls" style="margin-top: 1rem;">
            <h3>Test Print Data</h3>
            <p style="margin-top:0; font-size: 14px; color: #666;">Enter values to use when test printing. This simulates the default values functionality.</p>
            
            <div id="lookup-section" style="padding: 1rem; border: 1px solid #ddd; margin-bottom: 1rem; border-radius: 4px; background: #fdfdfd;">
                <h4 style="margin-top: 0; margin-bottom: 0.75rem; font-weight: 600;">Automated Data Lookup</h4>
                <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
                    <input type="text" id="lookup-barcode" placeholder="Barcode...">
                    <button onclick="performLookup('barcode')">Lookup</button>
                </div>
                <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
                    <input type="text" id="lookup-upc" placeholder="UPC...">
                    <button onclick="performLookup('upc')">Lookup</button>
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="lookup-isbn" placeholder="ISBN...">
                    <button onclick="performLookup('isbn')">Lookup</button>
                </div>
                <div id="lookup-status" style="margin-top: 0.75rem; font-size: 14px; min-height: 1.2em; color: #333;"></div>
            </div>

            <h4 style="margin-top: 0; margin-bottom: 0.5rem; font-weight: 600;">Manual Data Entry</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label for="test-title">Default Title</label>
                    <input type="text" id="test-title" placeholder="e.g., The Great Gatsby">
                </div>
                <div>
                    <label for="test-author">Default Author</label>
                    <input type="text" id="test-author" placeholder="e.g., Fit">
                </div>
                <div>
                    <label for="test-call-no">Default Call No.</label>
                    <input type="text" id="test-call-no" placeholder="e.g., FIC FIT">
                </div>
                <div>
                    <label for="test-volume">Default Volume</label>
                    <input type="text" id="test-volume" placeholder="e.g., v.1">
                </div>
            </div>
        </div>
        <div class="action-bar">
            <button id="copy-button">Copy to Clipboard</button>
            <div class="print-controls">
                <button id="print-button">Test Print</button>
                <label for="print-copies">Copies:</label>
                <input type="number" id="print-copies" value="1" min="1" style="width: 60px;">
            </div>
        </div>
    </div>

    <script>
    // --- DOM Elements ---
    const formatSelector = document.getElementById('format-selector');
    const previewArea = document.getElementById('preview-area');
    const controlsContainer = document.querySelector('.controls');
    const generatedCodeTextarea = document.getElementById('generated-code');
    const copyButton = document.getElementById('copy-button');
    const printButton = document.getElementById('print-button');

    // --- State ---
    let allLabelFormats = {};
    let currentFormatKey = null;
    let fieldStates = {}; // To store visibility and rotation

    let draggedElement = null;
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    // --- Utility Functions ---
    // ✅ Updated to handle inches and mm (96px = 1in = 25.4mm in CSS)
    function pxToUnit(px, unit = 'in') {
        if (unit === 'in') return (px / 96).toFixed(2);
        if (unit === 'mm') return ((px / 96) * 25.4).toFixed(2);
        if (unit === 'em') return (px / 10).toFixed(1);
        return px;
    }

    function unitToPx(value) {
        if (typeof value !== 'string') return value;
        if (value.endsWith('in')) return parseFloat(value) * 96;
        if (value.endsWith('mm')) return (parseFloat(value) / 25.4) * 96;
        if (value.endsWith('em')) return parseFloat(value) * 10;
        if (value.endsWith('px')) return parseFloat(value);
        return parseFloat(value) || 0;
    }
    
    function getStyleProperty(styleString, property) {
        const match = styleString.match(new RegExp(`${property}:\\s*([^;]+)`));
        return match ? match[1].trim() : null;
    }

    // --- Core Application Logic ---
    async function initializeApp() {
        try {
            const response = await fetch('/labelFormats.json');
            if (!response.ok) throw new Error('Network response was not ok.');
            allLabelFormats = await response.json();
            
            populateSelector();
            
            formatSelector.addEventListener('change', () => {
                renderFormat(formatSelector.value);
            });

            if (Object.keys(allLabelFormats).length > 0) {
                renderFormat(Object.keys(allLabelFormats)[0]);
            }
        } catch (error) {
            console.error('Failed to load label formats:', error);
            formatSelector.innerHTML = '<option>Error loading formats</option>';
        }
    }

    function populateSelector() {
        formatSelector.innerHTML = '';
        for (const key in allLabelFormats) {
            const option = document.createElement('option');
            option.value = key;
            option.textContent = allLabelFormats[key].name;
            formatSelector.appendChild(option);
        }
    }

    function renderFormat(formatKey) {
        currentFormatKey = formatKey;
        fieldStates = {}; // Reset states for new format
        const format = allLabelFormats[formatKey];

        previewArea.innerHTML = '';
        controlsContainer.innerHTML = '';

        previewArea.style.width = unitToPx(format.width) + 'px';
        previewArea.style.height = unitToPx(format.height) + 'px';

        const renderGroup = (fields, parent, prefix) => {
            fields.forEach((field, fIndex) => {
                const id = `${prefix}${fIndex}`;
                fieldStates[id] = { visible: true, rotation: 0 }; // Default state
                createLabelElement(field, id, parent);
            });
        };

        if (format.subLabels) {
            format.subLabels.forEach((subLabel, slIndex) => {
                const subLabelDiv = document.createElement('div');
                subLabelDiv.className = 'sub-label-container';
                subLabelDiv.style.width = unitToPx(subLabel.width) + 'px';
                subLabelDiv.style.height = unitToPx(subLabel.height) + 'px';
                subLabelDiv.style.top = unitToPx(subLabel.top) + 'px';
                subLabelDiv.style.left = unitToPx(subLabel.left) + 'px';
                renderGroup(subLabel.fields, subLabelDiv, `sl${slIndex}-f`);
                previewArea.appendChild(subLabelDiv);
            });
        } else {
            renderGroup(format.fields, previewArea, 'f');
        }
        
        createControlsForFormat();
        generateCode();
    }

    function createLabelElement(field, id, parent) {
        const el = document.createElement('div');
        el.id = id;
        el.className = 'label-element';
        el.dataset.key = field.key;
        el.textContent = field.defaultValue || field.key;
        el.style.cssText = field.style;
        parent.appendChild(el);
    }

    function createControlsForFormat() {
        const format = allLabelFormats[currentFormatKey];
        const createFieldControls = (fields, prefix) => {
            fields.forEach((field, index) => {
                const id = `${prefix}${index}`;
                const el = document.getElementById(id);
                if (!el) return;

                const controlGroup = document.createElement('div');
                controlGroup.className = 'control-group';

                const title = document.createElement('h3');
                title.textContent = `${field.key} (${prefix.replace('-f','')} Field ${index+1})`;
                controlGroup.appendChild(title);
                
                const textLabel = document.createElement('label');
                textLabel.textContent = 'Text:';
                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.value = el.textContent;
                textInput.addEventListener('input', (e) => {
                    el.textContent = e.target.value;
                    generateCode();
                });
                textLabel.appendChild(textInput);
                controlGroup.appendChild(textLabel);

                const fontSizeLabel = document.createElement('label');
                fontSizeLabel.textContent = 'Font Size (em):';
                const fontSizeInput = document.createElement('input');
                fontSizeInput.type = 'number';
                fontSizeInput.step = 0.1;
                fontSizeInput.value = pxToUnit(unitToPx(getStyleProperty(el.style.cssText, 'font-size') || '1em'), 'em');
                fontSizeInput.addEventListener('input', (e) => {
                    el.style.fontSize = `${e.target.value}em`;
                    generateCode();
                });
                fontSizeLabel.appendChild(fontSizeInput);
                controlGroup.appendChild(fontSizeLabel);

                // ✅ Updated to use inches in UI
                const createPositionInput = (label, property, unit, parentEl) => {
                    const inputLabel = document.createElement('label');
                    inputLabel.textContent = `${label} (${unit}):`;
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.step = 0.01;
                    input.value = pxToUnit(unitToPx(getStyleProperty(el.style.cssText, property) || '0'), unit);
                    
                    input.addEventListener('input', (e) => {
                        el.style[property] = `${unitToPx(e.target.value + unit)}px`;
                        generateCode();
                    });

                    inputLabel.appendChild(input);
                    parentEl.appendChild(inputLabel);
                    return input;
                };
                
                const topInput = createPositionInput('Top', 'top', 'in', controlGroup);
                const leftInput = createPositionInput('Left', 'left', 'in', controlGroup);

                el.topInput = topInput;
                el.leftInput = leftInput;

                const rotationLabel = document.createElement('label');
                rotationLabel.textContent = `Rotation (${fieldStates[id].rotation}°):`;
                const rotationInput = document.createElement('input');
                rotationInput.type = 'range';
                rotationInput.min = -180;
                rotationInput.max = 180;
                rotationInput.value = fieldStates[id].rotation;
                rotationInput.addEventListener('input', (e) => {
                    fieldStates[id].rotation = e.target.value;
                    el.style.transform = `rotate(${e.target.value}deg)`;
                    rotationLabel.textContent = `Rotation (${e.target.value}°):`;
                    generateCode();
                });
                controlGroup.appendChild(rotationLabel);
                controlGroup.appendChild(rotationInput);

                const visibilityLabel = document.createElement('label');
                const visibilityInput = document.createElement('input');
                visibilityInput.type = 'checkbox';
                visibilityInput.checked = fieldStates[id].visible;
                visibilityInput.addEventListener('change', (e) => {
                    fieldStates[id].visible = e.target.checked;
                    el.style.display = e.target.checked ? '' : 'none';
                    generateCode();
                });
                visibilityLabel.appendChild(visibilityInput);
                visibilityLabel.append(' Visible');
                controlGroup.appendChild(visibilityLabel);
                
                controlsContainer.appendChild(controlGroup);
            });
        };

        if (format.subLabels) {
            format.subLabels.forEach((sl, slIndex) => {
                createFieldControls(sl.fields, `sl${slIndex}-f`);
            });
        } else {
            createFieldControls(format.fields, 'f');
        }
    }

    function generateCode() {
        const format = allLabelFormats[currentFormatKey];
        let generated = `"${currentFormatKey}": {\n`;
        generated += `  "name": "${format.name}",\n`;
        generated += `  "width": "${format.width}",\n`;
        generated += `  "height": "${format.height}",\n`;
        generated += `  "orientation": "${format.orientation}",\n`;

        const processFields = (fields, prefix) => {
            let fieldStrings = [];
            fields.forEach((originalField, index) => {
                const id = `${prefix}${index}`;
                if (!fieldStates[id] || !fieldStates[id].visible) return;

                const el = document.getElementById(id);
                if (!el) return;
                
                const top = el.offsetTop;
                const left = el.offsetLeft;

                let styleParts = [
                    `position: absolute`,
                    `top: ${pxToUnit(top, 'in')}in`,   // ✅ Updated
                    `left: ${pxToUnit(left, 'in')}in`, // ✅ Updated
                    `font-size: ${el.style.fontSize || '1em'}`
                ];
                
                const originalStyle = originalField.style;
                if (getStyleProperty(originalStyle, 'font-weight')) styleParts.push(`font-weight: ${getStyleProperty(originalStyle, 'font-weight')}`);
                if (getStyleProperty(originalStyle, 'font-style')) styleParts.push(`font-style: ${getStyleProperty(originalStyle, 'font-style')}`);
                if (getStyleProperty(originalStyle, 'text-align')) styleParts.push(`text-align: ${getStyleProperty(originalStyle, 'text-align')}`);

                if (fieldStates[id].rotation != 0) {
                    styleParts.push(`transform: rotate(${fieldStates[id].rotation}deg)`);
                }
                
                let fieldStr = `        {\n`;
                fieldStr += `          "key": "${originalField.key}",\n`;
                fieldStr += `          "style": "${styleParts.join('; ')}"`
                if (originalField.prefixKey) fieldStr += `,\n          "prefixKey": "${originalField.prefixKey}"`;
                if (originalField.useTheme) fieldStr += `,\n          "useTheme": ${originalField.useTheme}`;
                fieldStr += `\n        }`;
                fieldStrings.push(fieldStr);
            });
            return `      "fields": [\n${fieldStrings.join(',\n')}\n      ]`;
        };

        if (format.subLabels) {
            generated += `  "subLabels": [\n`;
            let subLabelStrings = [];
            format.subLabels.forEach((sl, slIndex) => {
                let subLabelStr = `    {\n`;
                subLabelStr += `      "width": "${sl.width}",\n`;
                subLabelStr += `      "height": "${sl.height}",\n`;
                subLabelStr += `      "top": "${sl.top}",\n`;
                subLabelStr += `      "left": "${sl.left}",\n`;
                subLabelStr += processFields(sl.fields, `sl${slIndex}-f`);
                subLabelStr += `\n    }`;
                subLabelStrings.push(subLabelStr);
            });
            generated += subLabelStrings.join(',\n');
            generated += `\n  ]\n`;
        } else {
            generated += processFields(format.fields, 'f') + '\n';
        }

        generated += `}`;
        generatedCodeTextarea.value = generated;
    }

    // --- Event Listeners ---
    previewArea.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('label-element')) {
            isDragging = true;
            draggedElement = e.target;
            draggedElement.style.cursor = 'grabbing';
            
            const rect = draggedElement.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (isDragging && draggedElement) {
            e.preventDefault();
            const parentContainer = draggedElement.parentElement;
            const previewRect = parentContainer.getBoundingClientRect();

            let newLeft = e.clientX - previewRect.left - offsetX;
            let newTop = e.clientY - previewRect.top - offsetY;

            const constrainedLeft = Math.max(0, Math.min(newLeft, parentContainer.clientWidth - draggedElement.offsetWidth));
            const constrainedTop = Math.max(0, Math.min(newTop, parentContainer.clientHeight - draggedElement.offsetHeight));

            draggedElement.style.left = `${constrainedLeft}px`;
            draggedElement.style.top = `${constrainedTop}px`;
            
            if (draggedElement.topInput && draggedElement.leftInput) {
                draggedElement.topInput.value = pxToUnit(constrainedTop, 'in');
                draggedElement.leftInput.value = pxToUnit(constrainedLeft, 'in');
            }

            generateCode();
        }
    });

    document.addEventListener('mouseup', () => {
        if (isDragging && draggedElement) {
            draggedElement.style.cursor = 'move';
        }
        isDragging = false;
        draggedElement = null;
    });
    
    copyButton.addEventListener('click', () => {
        generatedCodeTextarea.select();
        document.execCommand('copy');
        copyButton.textContent = 'Copied!';
        setTimeout(() => {
            copyButton.textContent = 'Copy to Clipboard';
        }, 2000);
    });

    printButton.addEventListener('click', printTestLabel);

    function printTestLabel() {
        if (!currentFormatKey) {
            alert('Please select a format first.');
            return;
        }
        
        const copies = parseInt(document.getElementById('print-copies').value, 10) || 1;
        const testData = {
            'Title': document.getElementById('test-title').value,
            'Author': document.getElementById('test-author').value,
            'Call No.': document.getElementById('test-call-no').value,
            'Volume': document.getElementById('test-volume').value,
        };

        const format = allLabelFormats[currentFormatKey];
        const printWindow = window.open('', '_blank');
        if (!printWindow) {
            alert('Please allow pop-ups to print labels.');
            return;
        }
        
        const widthIn = format.width.endsWith('mm') ? (parseFloat(format.width) / 25.4).toFixed(2) + 'in' : format.width;
        //const heightIn = format.height.endsWith('mm') ? (parseFloat(format.height) / 25.4).toFixed(2) + 'in' : format.height;

        const heightIn = format.height.endsWith('mm')
  ? Math.max(0, (parseFloat(format.height) / 25.4) - 0.1).toFixed(2) + 'in'
  : Math.max(0, parseFloat(format.height) - 0.1).toFixed(2) + 'in';


        let labelsHtml = '';
        const singleLabelHtml = `<div class="label">${previewArea.innerHTML}</div>`;
        for (let i = 0; i < copies; i++) {
            labelsHtml += singleLabelHtml;
        }

        printWindow.document.title = "Test Print - " + format.name;
        const style = printWindow.document.createElement('style');
        style.textContent = `
            @page { 
                size: ${widthIn} ${heightIn};
                margin: 0;
            }
            @media print {
                @page {
                    size: 98.425mm 38.0mm; /* Sets a custom page size of 4 inches by 6 inches */
                    orientation: landscape; /* Sets the orientation to landscape */
                }
            }
            html, body {
                margin: 0;
                padding: 0;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
            }
            .label {
                width: ${widthIn};
                height: ${heightIn};
                overflow: hidden;
                position: relative;
                box-sizing: border-box;
                page-break-after: always;
            }
            .label:last-child {
                page-break-after: auto;
            }
            .label-element, .sub-label-container {
                position: absolute;
                box-sizing: border-box;
            }
            .label-element {
                transform-origin: center;
                border: 1px dotted transparent;
            }
            .sub-label-container {
                border: 1px solid #9cf;
            }
        `;
        printWindow.document.head.appendChild(style);
        printWindow.document.body.innerHTML = labelsHtml;

        // Now, adjust styles in the new window
        const previewElements = Array.from(previewArea.querySelectorAll('.label-element, .sub-label-container'));
        const allPrintElements = Array.from(printWindow.document.querySelectorAll('.label-element, .sub-label-container'));

        for (let i = 0; i < copies; i++) {
            for (let j = 0; j < previewElements.length; j++) {
                const previewEl = previewElements[j];
                const printEl = allPrintElements[i * previewElements.length + j];
                
                if (printEl) {
                    if (printEl.classList.contains('label-element')) {
                        const key = printEl.dataset.key;
                        const testValue = testData[key];

                        // Find the original field definition to get the defaultValue
                        let originalField;
                        if (format.subLabels) {
                            const subLabelMatch = printEl.id.match(/sl(\d+)/);
                            if (subLabelMatch) {
                                const slIndex = parseInt(subLabelMatch[1], 10);
                                const fieldMatch = printEl.id.match(/f(\d+)/);
                                if (fieldMatch) {
                                     const fIndex = parseInt(fieldMatch[1], 10);
                                     originalField = format.subLabels[slIndex]?.fields[fIndex];
                                }
                            }
                        } else {
                            const fieldMatch = printEl.id.match(/f(\d+)/);
                            if(fieldMatch) {
                                const fIndex = parseInt(fieldMatch[1], 10);
                                originalField = format.fields[fIndex];
                            }
                        }
                        
                        // Override logic: Test Data > JSON Default > Original Text
                        if (testValue) {
                            printEl.textContent = testValue;
                        } else if (originalField && originalField.defaultValue) {
                            printEl.textContent = originalField.defaultValue;
                        }
                    }
                    const computedStyle = window.getComputedStyle(previewEl);
                    printEl.style.top = pxToUnit(previewEl.offsetTop, 'in') + 'in';
                    printEl.style.left = pxToUnit(previewEl.offsetLeft, 'in') + 'in';
                    printEl.style.fontSize = computedStyle.fontSize;
                    printEl.style.fontWeight = computedStyle.fontWeight;
                    printEl.style.fontStyle = computedStyle.fontStyle;
                    printEl.style.transform = computedStyle.transform;

                    if (printEl.classList.contains('sub-label-container')) {
                        printEl.style.width = pxToUnit(previewEl.offsetWidth, 'in') + 'in';
                        printEl.style.height = pxToUnit(previewEl.offsetHeight, 'in') + 'in';
                    }
                }
            }
        }
        
        printWindow.document.close();

        printWindow.onload = () => {
            setTimeout(() => {
                printWindow.print();
            }, 500); // Timeout to ensure content is rendered
        };
    }

    // --- Initialization ---
    initializeApp();

    async function performLookup(type) {
        const lookupStatus = document.getElementById('lookup-status');
        const codeInput = document.getElementById(`lookup-${type}`);
        const code = codeInput.value.trim();

        if (!code) {
            lookupStatus.textContent = `Please enter a ${type.toUpperCase()}.`;
            lookupStatus.style.color = '#D32F2F';
            return;
        }

        lookupStatus.textContent = `Looking up ${type.toUpperCase()}...`;
        lookupStatus.style.color = '#333';

        try {
            const response = await fetch('/sierra', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ [type]: code }),
            });

            if (!response.ok) throw new Error(`Failed to fetch data (status: ${response.status})`);

            const data = await response.json();
            if (data.error) throw new Error(data.error);
            
            document.getElementById('test-title').value = data.title || '';
            document.getElementById('test-author').value = data.author ? data.author.substring(0, 3) : '';
            document.getElementById('test-call-no').value = data.callNumber || '';
            document.getElementById('test-volume').value = data.volume || '';

            lookupStatus.textContent = `Success! Populated data for ${type.toUpperCase()} ${code}.`;
            lookupStatus.style.color = '#388E3C';
            codeInput.value = '';

        } catch (err) {
            lookupStatus.textContent = `Error: ${err.message}`;
            lookupStatus.style.color = '#D32F2F';
            console.error(`Lookup failed for ${type}:`, err);
        } finally {
            setTimeout(() => {
                if (lookupStatus.textContent.startsWith('Success!') || lookupStatus.textContent.startsWith('Error:')) {
                   // lookupStatus.textContent = '';
                }
            }, 5000);
        }
    }
</script>
